<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusCart notification check</title><style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:20px;color:#173e29}button,a{padding:12px}pre{white-space:pre-wrap;background:#f0f7ed;padding:20px}</style><h1>Notification delivery check</h1><p>This checks the latest order alert received on this device. Close this tab before testing background delivery.</p><button id="refresh">Refresh status</button><a href="/admin/dashboard">Back to workspace</a><pre id="status">Checking account…</pre><script>
async function check(){const output=document.querySelector('#status');try{const r=await fetch('/api/users/profile',{cache:'no-store'});if(!r.ok){output.textContent='Please sign in to your shopkeeper account first.';return;}const u=await r.json();if(u.role!=='shopkeeper'){output.textContent='Shopkeeper account required.';return;}const registration=await navigator.serviceWorker.register('/sw.js',{updateViaCache:'none'});await registration.update();await navigator.serviceWorker.ready;const cache=await caches.open('campuscart-push-status-v1');const result=await cache.match('/__push-status__/'+u._id);output.textContent='Notification permission: '+Notification.permission+'\n'+(result?JSON.stringify(await result.json(),null,2):'No delivery result recorded yet.');}catch(e){output.textContent=e.message;}}
document.querySelector('#refresh').onclick=check;check();
</script></html>
